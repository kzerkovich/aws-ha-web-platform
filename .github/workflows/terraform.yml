name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD || 'dev-password-123' }}

jobs:
  terraform:
    name: Validate, plan, apply
    runs-on: ubuntu-latest

    services:
      moto:
        image: motoserver/moto:latest
        ports:
          - 5000:5000

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -input=false

      - name: Smoke test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws --endpoint-url=http://localhost:5000 s3 ls
          aws --endpoint-url=http://localhost:5000 elbv2 describe-load-balancers
          aws --endpoint-url=http://localhost:5000 rds describe-db-instances --query 'DBInstances[*].DBInstanceIdentifier'
